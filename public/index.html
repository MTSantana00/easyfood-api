<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyFood</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; padding: 28px 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fff4eb, #f3f4f6); color: #202020; font-family: Arial, sans-serif; }
        .celular { display: flex; flex-direction: column; width: 100%; max-width: 390px; height: 844px; border: 8px solid #1b1b1b; border-radius: 42px; background: white; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.22); overflow: hidden; position: relative; }
        .barra-status { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; padding: 16px 22px 8px; font-size: 12px; font-weight: bold; }
        .container { min-height: 0; flex: 1; padding: 12px 18px 28px; overflow-y: auto; scrollbar-width: none; }
        .container::-webkit-scrollbar { display: none; }
        header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
        .topo { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .menu { border: none; background: transparent; color: #333; cursor: pointer; font-size: 22px; }
        .logo { font-size: 24px; font-weight: 800; }
        .logo span { color: #ff5a1f; }
        .acoes-header { display: flex; gap: 8px; align-items: center; }
        .botao-login { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .botao-cadastro { display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; background: #ff5a1f; color: white; font-size: 24px; font-weight: bold; text-decoration: none; box-shadow: 0 6px 14px rgba(255, 90, 31, 0.25); transition: 0.2s; }
        .botao-cadastro:hover { transform: scale(1.06); background: #e94c13; }
        .apresentacao { padding: 22px; margin-bottom: 18px; border-radius: 20px; background: linear-gradient(135deg, #ff5a1f, #ff8a3d); color: white; box-shadow: 0 12px 25px rgba(255, 90, 31, 0.25); }
        .apresentacao h1 { margin-bottom: 8px; font-size: 23px; line-height: 1.15; }
        .apresentacao p { font-size: 13px; line-height: 1.4; }
        .busca { width: 100%; margin-bottom: 15px; padding: 14px 16px; border: 1px solid #e5e5e5; border-radius: 13px; outline: none; background: #fafafa; font-size: 14px; }
        .busca:focus { border-color: #ff5a1f; background: white; }
        .categorias { display: flex; gap: 8px; margin-bottom: 20px; padding-bottom: 4px; overflow-x: auto; scrollbar-width: none; }
        .categorias::-webkit-scrollbar { display: none; }
        .categoria { padding: 8px 14px; border: 1px solid #e3e3e3; border-radius: 30px; background: white; cursor: pointer; font-size: 12px; white-space: nowrap; }
        .categoria.ativa { border-color: #ff5a1f; background: #ff5a1f; color: white; }
        .cabecalho-lista { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 13px; }
        .titulo-lista { font-size: 18px; font-weight: bold; }
        .quantidade { color: #999; font-size: 12px; }
        .lista { display: grid; grid-template-columns: 1fr; gap: 11px; }
        .restaurante { display: flex; align-items: flex-start; gap: 13px; padding: 14px; border: 1px solid #eeeeee; border-radius: 15px; background: white; box-shadow: 0 5px 14px rgba(0, 0, 0, 0.06); }
        .icone { display: flex; width: 55px; height: 55px; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 13px; background: #fff2e8; font-size: 27px; }
        .informacoes { min-width: 0; flex: 1; }
        .informacoes h3 { margin-bottom: 5px; font-size: 15px; }
        .categoria-restaurante { margin-bottom: 7px; color: #888; font-size: 12px; }
        .detalhe { margin-bottom: 5px; color: #777; font-size: 10px; line-height: 1.3; }
        .mensagem { padding: 25px 15px; border-radius: 14px; background: #fafafa; color: #777; text-align: center; font-size: 13px; }
        footer { margin-top: 28px; color: #aaa; font-size: 11px; text-align: center; }
        
        /* Modal Auth */
        .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10; border-radius: 32px; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 85%; }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; }
        .modal-content button { width: 100%; padding: 12px; background: #ff5a1f; color: white; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .fechar-modal { background: #eee !important; color: #333 !important; }

        @media (max-width: 430px) {
            body { height: 100vh; padding: 0; background: white; overflow: hidden; }
            .celular { width: 100%; max-width: 100%; height: 100vh; border: none; border-radius: 0; box-shadow: none; }
            .modal { border-radius: 0; }
        }
    </style>
</head>
<body>
    <main class="celular">
        <div class="barra-status">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <div class="container">
            <header>
                <div class="topo">
                    <button class="menu">☰</button>
                    <div class="logo">Easy<span>Food</span></div>
                    <div class="acoes-header">
                        <button id="btnAuth" class="botao-login" onclick="toggleAuth()">Login</button>
                        <a href="/cadastro.html" class="botao-cadastro">+</a>
                    </div>
                </div>
            </header>

            <section class="apresentacao">
                <h1>Encontre seu próximo restaurante</h1>
                <p>Descubra os melhores sabores da sua região.</p>
            </section>

            <input type="search" id="busca" class="busca" placeholder="🔎 Buscar por nome ou categoria...">
            <div id="categorias" class="categorias"></div>

            <div class="cabecalho-lista">
                <h2 class="titulo-lista">Restaurantes</h2>
                <span id="quantidade" class="quantidade">0 resultados</span>
            </div>

            <section id="lista-restaurantes" class="lista">
                <p class="mensagem">Carregando restaurantes...</p>
            </section>

            <footer>EasyFood — encontre os melhores sabores</footer>
        </div>

        <!-- Modal Auth -->
        <div id="modalAuth" class="modal">
            <div class="modal-content">
                <h3>Acesso Restrito</h3>
                <input type="email" id="email" value="admin@easyfood.com" placeholder="E-mail">
                <input type="password" id="password" value="123456" placeholder="Senha">
                <button onclick="fazerLogin()">Entrar</button>
                <button class="fechar-modal" onclick="toggleAuth()">Cancelar</button>
            </div>
        </div>
    </main>

    <script>
        let restaurantes = [];
        let categoriaSelecionada = "Todos";
        const API_URL = 'http://localhost:3000';

        function escolherIcone(categoria) {
            const icones = { Pizza: "🍕", Burguer: "🍔", Massa: "🍝", Saudável: "🥗", Sushi: "🍣", Mexicana: "🌮", Churrasco: "🥩", Hamburgueria: "🍔", Pizzaria: "🍕", Japonesa: "🍣" };
            return icones[categoria] || "🍽️";
        }

        async function carregarRestaurantes() {
            try {
                const res = await fetch(`${API_URL}/restaurants`);
                restaurantes = await res.json();
                renderizarCategorias();
                filtrarRestaurantes();
            } catch (erro) {
                document.getElementById('lista-restaurantes').innerHTML = '<p class="mensagem">Erro ao conectar com a API.</p>';
            }
        }

        function renderizarCategorias() {
            const nomes = ["Todos", ...new Set(restaurantes.map(r => r.category))];
            document.getElementById('categorias').innerHTML = nomes.map(nome => `
                <button class="categoria ${nome === categoriaSelecionada ? 'ativa' : ''}" onclick="selecionarCategoria('${nome}')">${nome}</button>
            `).join("");
        }

        function selecionarCategoria(cat) {
            categoriaSelecionada = cat;
            renderizarCategorias();
            filtrarRestaurantes();
        }

        function filtrarRestaurantes() {
            const termo = document.getElementById('busca').value.toLowerCase();
            const resultado = restaurantes.filter(r => {
                const correspondeTexto = r.name.toLowerCase().includes(termo) || r.category.toLowerCase().includes(termo);
                const correspondeCat = categoriaSelecionada === "Todos" || r.category === categoriaSelecionada;
                return correspondeTexto && correspondeCat;
            });

            document.getElementById('quantidade').textContent = `${resultado.length} resultado(s)`;
            
            if(resultado.length === 0) {
                document.getElementById('lista-restaurantes').innerHTML = '<p class="mensagem">Nenhum restaurante encontrado.</p>';
                return;
            }

            document.getElementById('lista-restaurantes').innerHTML = resultado.map(r => `
                <article class="restaurante">
                    <div class="icone">${escolherIcone(r.category)}</div>
                    <div class="informacoes">
                        <h3>${r.name}</h3>
                        <p class="categoria-restaurante">${r.category} • 20-30 min</p>
                        <p class="detalhe">📍 ${r.address}</p>
                    </div>
                </article>
            `).join("");
        }

        function toggleAuth() {
            const token = localStorage.getItem('token');
            if(token) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                alert('Sessão encerrada.');
                checkAuth();
            } else {
                const modal = document.getElementById('modalAuth');
                modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    alert(`Bem-vindo(a), ${data.user.name}! Login efetuado com sucesso.`);
                    
                    document.getElementById('modalAuth').style.display = 'none';
                    checkAuth();
                } else {
                    alert(data.message || 'Erro no login. Verifica as credenciais.');
                }
            } catch (err) {
                alert('Erro ao conectar com o servidor.');
            }
        }

        function checkAuth() {
            const btn = document.getElementById('btnAuth');
            if (localStorage.getItem('token')) {
                btn.textContent = 'Sair';
                btn.style.backgroundColor = '#dc2626';
                btn.style.color = 'white';
            } else {
                btn.textContent = 'Login';
                btn.style.backgroundColor = '#333';
                btn.style.color = 'white';
            }
        }

        document.getElementById('busca').addEventListener('input', filtrarRestaurantes);
        carregarRestaurantes();
        checkAuth();
    </script>
</body>
</html>
